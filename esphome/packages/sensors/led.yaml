substitutions:
  # Overriding led_invert from a board config does NOT work: board configs are
  # listed before sensor packages, and a later package's substitution default
  # wins. Set it in the device config's own substitutions block, which beats
  # both. GPIO15 on the S2 mini is active-high, hence "false".
  led_invert: "false"
  led_strobe_on: 50ms
  led_strobe_off: 100ms

output:
  - id: led_output
    platform: ledc
    pin:
      number: "${led_pin}"
      inverted: "${led_invert}"

light:
  - id: led
    platform: monochromatic
    name: "LED"
    output: led_output
    icon: "mdi:led-outline"
    effects:
      - strobe:
          colors:
            - state: true
              duration: "${led_strobe_on}"
            - state: false
              duration: "${led_strobe_off}"
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.1s
          update_interval: 0.4s
      - pulse:
          name: "Slow Pulse"
          transition_length: 1s
          update_interval: 2s

esphome:
  on_boot:
    - priority: 0
      then:
        - light.turn_on: led
        - delay: 2s
        - light.turn_off: led

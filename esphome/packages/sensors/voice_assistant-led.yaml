# Full voice assistant for the ESP32-S2 mini, paired with the single-colour LED
# from led.yaml or status_led.yaml. Those are the only LED packages the S2 can
# use, since it is the only board defining ${led_pin}.
#
# Two things this does NOT provide, both deliberate:
#
#   * No media_player entity. voice_assistant talks to the speaker directly, so
#     Home Assistant gets no media_player to target. If you want TTS or
#     notification sounds (chime_tts, Node-RED), you need media_player.yaml --
#     and you cannot have both, as they declare the same components. On the S2
#     this is a genuine either/or.
#   * No micro_wake_word. On-device wake word crashes on the S2 mini, so wake
#     word detection is Home Assistant side only and the selector below offers
#     no "On device" option. The S3 mini has both; see
#     voice_assistant-rgb_led.yaml.

# 2MB PSRAM on the S2 mini, which is quad-mode. Octal is for the 8/16MB modules
# and would stop PSRAM working here entirely.
psram:
  mode: quad
  speed: 80MHz

i2s_audio:
  id: i2s_audiobus
  i2s_lrclk_pin: "${i2s_lrclk_pin}"   # WS
  i2s_bclk_pin: "${i2s_bclk_pin}"     # SCK

microphone:
  - platform: i2s_audio
    id: external_microphone
    channel: left
    adc_type: external
    i2s_din_pin: "${i2s_din_pin}"     # SD
    i2s_audio_id: i2s_audiobus
    pdm: false

speaker:
  - platform: i2s_audio
    id: va_speaker
    i2s_dout_pin: ${i2s_dout_pin}
    dac_type: external
    channel: mono

voice_assistant:
  id: va
  microphone: external_microphone
  speaker: va_speaker
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - light.turn_on:
        id: led
        effect: strobe
  on_tts_start:
    - light.turn_on:
        id: led
        effect: strobe
  on_end:
    - delay: 100ms
    - script.execute: reset_led
  on_error:
    - light.turn_on:
        id: led
        effect: none
    - delay: 1s
    - script.execute: reset_led
    - script.wait: reset_led
  on_client_connected:
    - delay: 5s
    - if:
        condition:
          lambda: return id(wake_word_engine_location).state == "In Home Assistant";
        then:
          - voice_assistant.start_continuous:
  on_client_disconnected:
    - voice_assistant.stop:

script:
  - id: reset_led
    then:
      - if:
          condition:
            - lambda: return id(wake_word_engine_location).state == "In Home Assistant";
            - switch.is_on: listen_light
          then:
            - light.turn_on:
                id: led
                effect: none
          else:
            - light.turn_off: led

# Whether the LED stays lit while the assistant is idle but listening, so the
# device shows at a glance that it is armed. Purely cosmetic.
switch:
  - platform: template
    name: "VA Listen Light"
    id: listen_light
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - script.execute: reset_led
    on_turn_off:
      - script.execute: reset_led

# Only two options here, unlike the S3: on-device wake word crashes on the S2
# mini, so "On device" is deliberately absent. Defaults to Disable so a freshly
# flashed device does not start streaming audio to Home Assistant unasked.
select:
  - id: wake_word_engine_location
    platform: template
    entity_category: config
    name: Wake word engine location
    optimistic: true
    restore_value: true
    options:
      - In Home Assistant
      - Disable
    initial_option: Disable
    on_value:
      - if:
          condition:
            lambda: return x == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start_continuous:
      - if:
          condition:
            lambda: return x == "Disable";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop
            - delay: 500ms
            - script.execute: reset_led
